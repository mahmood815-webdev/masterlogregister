<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submittals Master Log & Tracking Register</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- SheetJS for Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Babel standalone compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- CRITICAL: Root container where React attaches -->
  <div id="root"></div>

  <!-- CRITICAL: type="text/babel" is required for inline React code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      return (
        <div class="p-8 max-w-7xl mx-auto">
          <header class="mb-8 p-6 bg-slate-900 text-white rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold">Submittals Master Log Register</h1>
            <p class="text-slate-400 text-sm mt-1">Application loaded successfully on PC!</p>
          </header>

          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center py-12">
            <div class="inline-block p-4 bg-emerald-100 text-emerald-700 rounded-full mb-4">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 10 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h2 class="text-xl font-bold text-slate-800">System Ready</h2>
            <p class="text-slate-500 mt-2">Your React application is rendering properly in Microsoft Edge.</p>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
